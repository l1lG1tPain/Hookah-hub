[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # URL проекта и anon-ключ Supabase публичны по замыслу и обязаны быть в бандле фронта (VITE_*).
  # Сканер секретов Netlify видит их значения в dist и валит деплой — исключаем только их.
  # SUPABASE_SERVICE_ROLE и TELEGRAM_BOT_TOKEN по-прежнему проверяются.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY,VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,TELEGRAM_BOT_USERNAME"

# Остались только функции входа через Telegram
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[dev]
  command = "vite"
  port = 8888
  targetPort = 5173
  functions = "netlify/functions"
