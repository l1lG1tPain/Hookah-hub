<!doctype html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16110e" />
    <meta name="description" content="Hookah Hub — каталог кальянных миксов и табаков с оценками сообщества." />
    <meta property="og:title" content="Hookah Hub" />
    <meta property="og:description" content="Миксы, табаки и честный рейтинг от любителей кальяна." />
    <meta property="og:image" content="/icons/512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/192.png" />
    <link rel="apple-touch-icon" href="/icons/192.png" />
    <title>Hookah Hub</title>
    <script>
        try { var t = localStorage.getItem('hh-theme') || 'dark';
            if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
